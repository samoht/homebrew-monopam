name: Release Bottles

on:
  workflow_dispatch:
    inputs:
      binary:
        description: 'Binary to release (merlint, prune, irmin, crow, agent, mdns-query, uniboot, git-mono, precommit, bottler, monopam)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - merlint
          - prune
          - irmin
          - crow
          - agent
          - mdns-query
          - uniboot
          - git-mono
          - precommit
          - bottler
          - monopam

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: arm64_sonoma
          - os: ubuntu-latest
            platform: x86_64_linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout monorepo
        run: git clone --depth 1 https://tangled.org/gazagnaire.org/ocaml-git.git mono

      - name: Install OCaml (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eo pipefail
          brew install opam pkg-config gmp libffi
          opam init --disable-sandboxing --no-setup -y
          opam install dune -y

      - name: Install OCaml (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev libffi-dev pkg-config
          opam init --disable-sandboxing --no-setup -y
          opam install dune -y

      - name: Generate lockfile
        working-directory: mono
        run: opam exec -- dune pkg lock

      - name: Build bottler
        working-directory: mono
        run: opam exec -- dune build --release ocaml-homebrew/bin/main.exe

      - name: Build bottles
        working-directory: mono
        run: |
          set -eo pipefail
          if [ "${{ inputs.binary }}" = "all" ]; then
            opam exec -- dune exec -- bottler build
          else
            opam exec -- dune exec -- bottler build "${{ inputs.binary }}"
          fi

      - name: Upload bottles to storage
        working-directory: mono
        run: |
          set -eo pipefail
          if [ "${{ inputs.binary }}" = "all" ]; then
            opam exec -- dune exec -- bottler upload
          else
            opam exec -- dune exec -- bottler upload "${{ inputs.binary }}"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}

      - name: Save checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.platform }}
          path: mono/*.sha256

  update-tap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          path: checksums

      - name: Checkout monorepo
        run: git clone --depth 1 https://tangled.org/gazagnaire.org/ocaml-git.git mono

      - name: Install OCaml
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev libffi-dev pkg-config
          opam init --disable-sandboxing --no-setup -y
          opam install dune -y

      - name: Generate lockfile
        working-directory: mono
        run: opam exec -- dune pkg lock

      - name: Build bottler
        working-directory: mono
        run: opam exec -- dune build --release ocaml-homebrew/bin/main.exe

      - name: Update formulas with checksums
        run: |
          set -eo pipefail
          mkdir -p Formula
          cd mono
          if [ "${{ inputs.binary }}" = "all" ]; then
            for name in merlint prune irmin crow agent mdns-query uniboot git-mono precommit bottler monopam; do
              opam exec -- dune exec -- bottler formula "$name" > ../Formula/"$name".rb
            done
          else
            opam exec -- dune exec -- bottler formula "${{ inputs.binary }}" > "../Formula/${{ inputs.binary }}.rb"
          fi

      - name: Commit and push
        run: |
          set -eo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/
          git diff --staged --quiet || git commit -m "Update bottles for ${{ inputs.binary }}"
          git push origin HEAD
